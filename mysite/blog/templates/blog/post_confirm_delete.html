{% extends "blog/base.html" %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
    <h2>Удалить пост?</h2>

    <p>Вы действительно хотите удалить пост
       <strong>"{{ post.title }}"</strong>?
       Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: #460203; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">
            Да, удалить
        </button>
        <a href="{% url 'post_detail' slug=post.slug %}" style="margin-left: 15px;">Отмена</a>
    </form>
{% endblock %}
